[project]
name = "supplier-document-checker"
version = "0.1.0"
requires-python = ">=3.12"
# Vercel installs from here (not requirements.txt) when pyproject.toml exists. Same pins as requirements.txt, minus pytest.
dependencies = [
    "pydantic==2.14.2",
    "pdfplumber==0.11.10",
    "python-dotenv==1.2.4",
    "google-genai==2.34.0",
    "langgraph==1.2.19",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.vercel]
entrypoint = "api.check:app"
